[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-pos"
version = "1.0.0"
description = "Offline Windows retail POS and billing application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt5>=5.15,<5.16",
    "SQLAlchemy>=2.0,<3",
    "reportlab>=4.0,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
